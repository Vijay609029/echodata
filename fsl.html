<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chana Selling</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f0;
        }

        #container {
            width: 500px;
            max-width: 95%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #aaa;
        }

        h1 {
            text-align: center;
            color: #315b20;
            margin-bottom: 20px;
        }

        .stock {
            background: #e9f5e4;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .stock h2 {
            color: #315b20;
            margin-bottom: 5px;
        }

        .price {
            background: #fff3cd;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #9a6500;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 16px;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            background: #315b20;
            color: white;
            font-size: 17px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }

        #records {
            display: none;
            margin-top: 20px;
        }

        .sale {
            background: #f5f5f5;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .sale h3 {
            color: #315b20;
            margin-bottom: 10px;
        }

        .total {
            color: #c46b00;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .delete {
            background: #c62828;
        }

        .status {
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div id="container">

        <h1>🌾 Chana Selling</h1>

        <div class="stock">
            <h2>Available Stock</h2>
            <p id="stock">600 KG</p>
        </div>

        <div class="price">
            Chana Price: ₹100 / KG
        </div>

        <input type="text" id="name" placeholder="Enter Customer Name">

        <textarea id="address" placeholder="Enter Customer Address"></textarea>

        <input type="number" id="quantity" placeholder="Enter Quantity in KG">

        <select id="payment">
            <option value="">Select Payment Status</option>
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Pending">Pending</option>
        </select>

        <button onclick="saveSale()">Sell Chana</button>

        <button onclick="viewRecords()">View Records</button>

        <div id="records"></div>

    </div>

    <script>

        let price = 100;

        let stock = localStorage.getItem("chanaStock");

        if (stock == null) {
            stock = 600;
            localStorage.setItem("chanaStock", stock);
        } else {
            stock = Number(stock);
        }

        let sales = JSON.parse(localStorage.getItem("chanaSales")) || [];

        document.getElementById("stock").innerHTML = stock + " KG";

        function saveSale() {

            let name = document.getElementById("name").value;
            let address = document.getElementById("address").value;
            let quantity = Number(document.getElementById("quantity").value);
            let payment = document.getElementById("payment").value;

            if (name == "" || address == "" || quantity == "" || payment == "") {
                alert("Please fill all details");
                return;
            }

            if (quantity <= 0) {
                alert("Enter valid quantity");
                return;
            }

            if (quantity > stock) {
                alert("Not enough stock available");
                return;
            }

            let total = quantity * price;

            let sale = {
                name: name,
                address: address,
                quantity: quantity,
                price: price,
                total: total,
                payment: payment
            };

            sales.push(sale);

            stock = stock - quantity;

            localStorage.setItem("chanaSales", JSON.stringify(sales));
            localStorage.setItem("chanaStock", stock);

            document.getElementById("stock").innerHTML = stock + " KG";

            document.getElementById("name").value = "";
            document.getElementById("address").value = "";
            document.getElementById("quantity").value = "";
            document.getElementById("payment").value = "";

            alert("Chana Sale Saved");
        }

        function viewRecords() {

            sales = JSON.parse(localStorage.getItem("chanaSales")) || [];

            let records = document.getElementById("records");

            records.style.display = "block";

            records.innerHTML = "<h2>Saved Records</h2>";

            if (sales.length == 0) {
                records.innerHTML += "<p>No Records Found</p>";
                return;
            }

            sales.forEach(function (sale, index) {

                records.innerHTML += `
                    <div class="sale">

                        <h3>Customer ${index + 1}</h3>

                        <p><b>Name:</b> ${sale.name}</p>

                        <p><b>Address:</b> ${sale.address}</p>

                        <p><b>Quantity:</b> ${sale.quantity} KG</p>

                        <p><b>Price:</b> ₹${sale.price} / KG</p>

                        <p class="total">Total: ₹${sale.total}</p>

                        <div class="status">
                            <b>Payment:</b>

                            <select onchange="changePayment(${index}, this.value)">

                                <option value="Cash" ${sale.payment == "Cash" ? "selected" : ""}>
                                    Cash
                                </option>

                                <option value="UPI" ${sale.payment == "UPI" ? "selected" : ""}>
                                    UPI
                                </option>

                                <option value="Pending" ${sale.payment == "Pending" ? "selected" : ""}>
                                    Pending
                                </option>

                                <option value="Paid" ${sale.payment == "Paid" ? "selected" : ""}>
                                    Paid
                                </option>

                            </select>

                        </div>

                        <button class="delete" onclick="deleteSale(${index})">
                            Delete
                        </button>

                    </div>
                `;

            });
        }

        function changePayment(index, status) {

            sales[index].payment = status;

            localStorage.setItem("chanaSales", JSON.stringify(sales));

            alert("Payment Status Updated");
        }

        function deleteSale(index) {

            sales.splice(index, 1);

            localStorage.setItem("chanaSales", JSON.stringify(sales));

            viewRecords();
        }

    </script>

</body>

</html>
